<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSurf - Verifica Sito</title>
    <style>
        .result {
            padding: 20px;
            text-align: center;
            font-size: 1.2em;
            border-radius: 8px;
            margin-top: 20px;
        }
        .phishing {
            background-color: #f8d7da;  /* Colore rosso per phishing */
            color: #721c24;
        }
        .safe {
            background-color: #d4edda;  /* Colore verde per siti sicuri */
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>SafeSurf - Verifica URL</h1>
    
    <form method="POST" action="/">
        <label for="url">Inserisci URL:</label>
        <input type="text" name="url" id="url" required>
        <button type="submit">Verifica</button>
    </form>

    {% if result %}
        <div class="result {% if '❌' in result %}phishing{% else %}safe{% endif %}">
            {{ result }}
        </div>
    {% endif %}

    <a href="/storico">Visualizza Storico Verifiche</a>
</body>
</html>
